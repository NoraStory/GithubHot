name: 基础设施-风控参数回放评估（只读）

# 手动触发：在生产库全量违规事件 + 封禁标签上重放候选参数组，
# 输出召回率/误报代理率/提前量对比表（算法改进 A 批：调参看数字）。
# 只读操作，不改任何数据。
on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 回放评估
        env:
          PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/deploy -p $PORT \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' < scripts/remote-risk-replay.sh
