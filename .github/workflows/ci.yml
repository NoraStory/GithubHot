name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          mkdir -p internal/interfaces/webui
          cp -r web/dist internal/interfaces/webui/dist
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1 -race -v 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
      - name: Output failures
        if: failure()
        run: grep -B 3 -A 10 -- "--- FAIL" test-output.txt || true
      - name: Build
        run: go build -o githubhot ./cmd/githubhot
