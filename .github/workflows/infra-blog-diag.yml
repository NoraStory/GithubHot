name: 基础设施-博客抓取诊断

# 手动触发：从服务器实测 CSDN 文章页可达性（正文抓取 0 成功率排查）。
# 只读诊断，不改动服务。
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 服务器侧博客抓取诊断
        env:
          PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/deploy -p $PORT \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' < scripts/remote-blog-diag.sh
