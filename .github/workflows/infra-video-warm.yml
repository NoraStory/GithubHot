name: 基础设施-背景视频预热

# 手动触发：把 x1-x6（主题作者源）断点续传搬运进服务器磁盘缓存。
# 该源对数据中心连接中途断流，单次拉取拿不到完整文件；本脚本循环续传
# 直到 Content-Length 对齐，落到 data/videos/x/ 后 serveVideoCached 本地直出。
on:
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 服务器侧视频预热
        env:
          PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/deploy -p $PORT \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' < scripts/remote-video-warm.sh
