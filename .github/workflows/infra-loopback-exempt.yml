name: 基础设施-回环豁免切换（IP_GUARD_LOCAL）

# 手动触发：切换服务器 .env 的 IP_GUARD_LOCAL（1=豁免回环/运维工具，0=回环也计分）。
# 背景：IP 归因修复（TRUSTED_PROXY）后，回环上只剩 nginx 转发与运维探针，
# 豁免回环不再有"全站绕过"风险，同时避免运维 curl 的 bot-ua 计分自封 127.0.0.1。
# 远端脚本为仓库文件 scripts/remote-loopback.sh（stdin 喂 bash -s）。
on:
  workflow_dispatch:
    inputs:
      value:
        description: 'IP_GUARD_LOCAL 值（1=豁免回环，0=回环也计分）'
        required: true
        default: '1'

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 切换并重启验证
        env:
          PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DIR: ${{ vars.DEPLOY_DIR || '/opt/githubhot' }}
          VALUE: ${{ inputs.value }}
        run: |
          ssh -i ~/.ssh/deploy -p $PORT \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "GHVAL='$VALUE' GHDIR='$DIR' bash -s" < scripts/remote-loopback.sh
