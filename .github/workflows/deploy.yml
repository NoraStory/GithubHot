name: 前后端构建部署

# 触发：main 分支代码变动（前后端任一变即全量重建部署）
on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  # 密钥探测：secrets 不能直接在 if 条件里用，先经 env 落到 outputs
  check:
    runs-on: ubuntu-latest
    outputs:
      has_deploy: ${{ steps.s.outputs.has_deploy }}
      has_pat: ${{ steps.s.outputs.has_pat }}
    steps:
      - id: s
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          APP_REPO_PAT: ${{ secrets.APP_REPO_PAT }}
        run: |
          echo "has_deploy=$([ -n "$DEPLOY_HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_pat=$([ -n "$APP_REPO_PAT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 前端构建 → 同步到 Go 嵌入目录
      - name: 构建前端
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          rm -rf internal/interfaces/webui/dist
          cp -r web/dist internal/interfaces/webui/dist

      # 服务器用 linux/amd64；windows/amd64 作为发布产物
      - name: 编译二进制
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" -o dist/githubhot-linux-amd64 ./cmd/githubhot
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" -o dist/githubhot-windows-amd64.exe ./cmd/githubhot

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  deploy:
    needs: [build, check]
    if: needs.check.outputs.has_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 重建前端 + linux 二进制
        run: |
          cd web && npm ci && npm run build && cd ..
          rm -rf internal/interfaces/webui/dist
          cp -r web/dist internal/interfaces/webui/dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" -o githubhot ./cmd/githubhot
          tar czf webdist.tar.gz -C internal/interfaces/webui dist

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 上传并重启服务
        env:
          PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DIR: ${{ vars.DEPLOY_DIR || '/opt/githubhot' }}
        run: |
          set -e
          # 跨网 SSH 链路慢且易静默断流（实测 30-50 分钟无输出后 connection refused /
          # 半截文件）：二进制 gzip 压缩 + keepalive 快速判死 + 重试 + 远端完整性校验。
          gzip -k9f githubhot

          SCP_OPTS=(-i ~/.ssh/deploy -P "$PORT" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes)
          SSH_OPTS=(-i ~/.ssh/deploy -p "$PORT" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes)
          TARGET="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          upload() {
            for i in 1 2 3; do
              if timeout 1800 scp "${SCP_OPTS[@]}" "$1" "$TARGET:$2"; then return 0; fi
              echo "上传 $1 第 $i 次失败，15s 后重试…"
              sleep 15
            done
            echo "::error::上传 $1 三次均失败"; return 1
          }

          # 二进制传临时名：运行中的文件被 scp 直接覆盖会 ETXTBSY（text file busy）
          upload githubhot.gz "$DIR/githubhot.gz"
          upload webdist.tar.gz "$DIR/webdist.tar.gz"

          ssh "${SSH_OPTS[@]}" "$TARGET" "
            set -e
            cd $DIR
            tar xzf webdist.tar.gz
            rm -f webdist.tar.gz
            gzip -t githubhot.gz   # 传输完整性校验，半截文件在此失败
            gunzip -c githubhot.gz > githubhot.new
            rm -f githubhot.gz
            chmod +x githubhot.new
            test -s githubhot.new || { echo '::error::新二进制为空，中止'; exit 1; }
            cp -f githubhot githubhot.bak 2>/dev/null || true
            mv -f githubhot.new githubhot
            sudo systemctl restart githubhot || true
            # 就绪轮询：新版本首启要加载 GeoIP/JA4 等数据文件，固定 sleep 2 会误杀慢启动
            # 注意 \$ 转义——本段在双引号内下发，变量须在服务器侧展开
            ok=''
            for i in \$(seq 1 15); do
              if curl -fsS http://127.0.0.1:8787/api/v1/healthz; then ok=1; break; fi
              sleep 2
            done
            if [ -z "\$ok" ]; then
              echo '健康检查失败：启动日志（journalctl 最后 40 行）↓'
              sudo journalctl -u githubhot -n 40 --no-pager || true
              echo '回滚旧版本'
              sudo systemctl stop githubhot || true
              mv -f githubhot.bak githubhot
              sudo systemctl start githubhot
              exit 1
            fi
            rm -f githubhot.bak
          "

      # P2-5/P3-3：部署后拉取 GeoIP 国家库 + JA4 映射表（幂等，已有则跳过；失败非致命自动降级）
      - name: 拉取 GeoIP / JA4 数据
        if: needs.check.outputs.has_deploy == 'true'
        env:
          PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DIR: ${{ vars.DEPLOY_DIR || '/opt/githubhot' }}
        run: |
          ssh -i ~/.ssh/deploy -p $PORT \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd $DIR
            if [ ! -f data/geo.mmdb ]; then
              echo '[deploy] 下载 GeoIP 国家库...'
              ./githubhot geo download || echo '[deploy] GeoIP 下载失败（非致命，核验自动降级）'
            else
              echo '[deploy] GeoIP 已存在，跳过'
            fi
            if [ ! -f data/ja4-mapping.csv ]; then
              echo '[deploy] 下载 JA4 映射表...'
              ./githubhot ja4 update || echo '[deploy] JA4 下载失败（非致命，核验自动降级）'
            else
              echo '[deploy] JA4 已存在，跳过'
            fi
          "

  # 后端部署完成后通知 APP 仓库重建（API 契约变动时 APP 跟随出新包）
  notify-app:
    needs: [deploy, check]
    if: always() && needs.deploy.result == 'success' && needs.check.outputs.has_pat == 'true'
    runs-on: ubuntu-latest
    steps:
      # 先校验 token 有效性：401=值不对/过期，403=权限不足，200=可用
      # （secret 首尾混入空白/说明文字会让 dispatch 直接 400，此处提前暴露）
      - name: 校验通知凭据
        run: |
          set -e
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.APP_REPO_PAT }}" \
            https://api.github.com/user)
          echo "token /user 状态码: $CODE"
          [ "$CODE" = "200" ] || { echo "::error::APP_REPO_PAT 不可用（$CODE），请到仓库 Settings→Secrets 更新"; exit 1; }

      - name: 触发 APP 仓库构建
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.APP_REPO_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository_owner }}/GithubHot-App/dispatches \
            -d '{"event_type":"backend-deployed","client_payload":{"sha":"${{ github.sha }}","repo":"${{ github.repository }}"}}'
