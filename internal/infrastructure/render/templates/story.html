<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事件详情 · GithubHot</title>
<link rel="stylesheet" href="https://files.lololowe.com/fonts/lxgw-lite/result.css">
<style>
  :root { --theme:#eabcbd; --theme-op:rgba(234,188,189,.25); --hover:#ff7242; --bg:#f7f9fe; --card:#fff; --cborder:#e3e8f7; --fc:#363636; --gray:#999; --blue:#425aef; --green:#36b562;
    --radius:8px; --shadow:0 3px 8px 6px rgba(7,17,27,.05); --font:'LXGW WenKai Lite','PingFang SC','Microsoft YaHei',sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fc); font:16px/1.7 var(--font); }
  a { color:var(--fc); text-decoration:none; } a:hover { color:var(--hover); }
  .topnav { position:fixed; top:0; left:0; right:0; z-index:91; height:60px; display:flex; align-items:center; padding:0 1.5rem; background:var(--card); outline:1px solid var(--cborder); }
  .topnav .brand { font-weight:700; font-size:1.15rem; display:flex; align-items:center; gap:8px; }
  .topnav .brand .dot { width:10px; height:10px; border-radius:50%; background:var(--theme); box-shadow:0 0 0 4px var(--theme-op); }
  .topnav a.site-page { padding:8px 14px; border-radius:var(--radius); font-size:.95rem; }
  .topnav a.site-page:hover { background:var(--theme-op); color:var(--hover); }
  .wrap { max-width:860px; margin:0 auto; padding:84px 1.5rem 2rem; }
  .card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:1.6rem 2rem; margin-bottom:1.2rem; }
  h1 { font-size:1.55rem; line-height:1.45; }
  h1 a { color:var(--blue); font-size:1.05rem; vertical-align:middle; margin-left:10px; }
  .badges { margin:10px 0; }
  .badge { display:inline-block; background:var(--theme-op); color:#a8766f; border-radius:50px; padding:1px 10px; font-size:.74rem; margin-right:6px; }
  .overview { margin:14px 0; padding:12px 16px; background:var(--bg); border-left:3px solid var(--theme); border-radius:6px; font-size:1rem; }
  .summary { color:var(--fc); opacity:.9; }
  h3 { font-size:1.08rem; margin:1.4rem 0 .7rem; position:relative; padding-left:1.22rem; }
  h3::before { content:'✦'; position:absolute; left:0; color:#ffbf00; animation:ccc 1.6s linear infinite; }
  @keyframes ccc { 0% { transform:rotate(0); } to { transform:rotate(-1turn); } }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  thead th { background:var(--theme-op); padding:8px 10px; text-align:left; }
  thead th:first-child { border-radius:6px 0 0 6px; } thead th:last-child { border-radius:0 6px 6px 0; }
  tbody td { padding:8px 10px; border-bottom:1px solid #f1f3fa; vertical-align:top; }
  tbody tr:last-child td { border-bottom:none; }
  .desc { color:var(--gray); font-size:.8rem; }
  .num { font-variant-numeric:tabular-nums; } .hot { color:var(--hover); font-weight:700; }
  .hist { display:flex; align-items:flex-end; gap:4px; height:80px; padding:8px 0; }
  .hist .bar { flex:1; background:linear-gradient(180deg, var(--theme), #f6d6c3); border-radius:3px 3px 0 0; min-height:4px; position:relative; }
  .hist .bar span { position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); font-size:.62rem; color:var(--gray); white-space:nowrap; }
  .empty { color:var(--gray); text-align:center; padding:18px 0; font-size:.92rem; }
  footer { text-align:center; color:var(--gray); font-size:.85rem; padding:20px; }
  footer a { color:var(--hover); }
</style>
</head>
<body>
<div class="topnav">
  <a class="brand" href="/"><span class="dot"></span>GithubHot</a>
  <a class="site-page" href="/">← 返回双榜</a>
</div>
<div class="wrap">
  <div class="card">
    <h1>{{TITLE}}<a href="{{URL}}" target="_blank" rel="noopener">原文 ↗</a></h1>
    <div class="badges">{{BADGES}}</div>
    <div class="overview">{{OVERVIEW}}</div>
    <div class="summary">{{SUMMARY}}</div>
  </div>

  <div class="card">
    <h3>热度走势</h3>
    {{HISTORY}}
  </div>

  <div class="card">
    <h3>关联 GitHub 项目</h3>
    {{PROJECTS}}
  </div>

  <div class="card">
    <h3>同事件报道（{{MEMBER_COUNT}}）</h3>
    <table>
      <thead><tr><th>来源</th><th>标题</th><th>评分 A/B</th><th>时间</th></tr></thead>
      <tbody>{{MEMBERS}}</tbody>
    </table>
  </div>
</div>
<footer><a href="/">← GithubHot 双榜</a></footer>
</body>
</html>
