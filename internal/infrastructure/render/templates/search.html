<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索：{{QUERY}} · GithubHot</title>
<link rel="stylesheet" href="https://files.lololowe.com/fonts/lxgw-lite/result.css">
<style>
  :root { --theme:#eabcbd; --theme-op:rgba(234,188,189,.25); --hover:#ff7242; --bg:#f7f9fe; --card:#fff; --cborder:#e3e8f7; --fc:#363636; --gray:#999; --blue:#425aef;
    --radius:8px; --shadow:0 3px 8px 6px rgba(7,17,27,.05);
    --font:'LXGW WenKai Lite','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fc); font:16px/1.7 var(--font); }
  ::selection { background:rgba(234,188,189,.7); }
  a { color:var(--fc); text-decoration:none; } a:hover { color:var(--hover); }
  .topnav { position:fixed; top:0; left:0; right:0; z-index:91; height:60px; display:flex; align-items:center; padding:0 1.5rem; background:var(--card); outline:1px solid var(--cborder); }
  .topnav .brand { font-weight:700; font-size:1.15rem; display:flex; align-items:center; gap:8px; }
  .topnav .brand .dot { width:10px; height:10px; border-radius:50%; background:var(--theme); box-shadow:0 0 0 4px var(--theme-op); }
  .topnav a.site-page { padding:8px 14px; border-radius:var(--radius); font-size:.95rem; }
  .topnav a.site-page:hover { background:var(--theme-op); color:var(--hover); }
  .wrap { max-width:860px; margin:0 auto; padding:84px 1.5rem 2rem; }
  h2 { font-size:1.25rem; margin:0 0 .6rem; position:relative; padding-left:1.35rem; }
  h2::before { content:'✽'; position:absolute; left:0; color:#fb7061; animation:ccc 1.6s linear infinite; }
  @keyframes ccc { 0% { transform:rotate(0); } to { transform:rotate(-1turn); } }
  .sub { color:var(--gray); font-size:.85rem; margin-bottom:12px; }
  form { margin:10px 0 16px; display:flex; gap:10px; }
  input[type=text] { flex:1; background:var(--card); color:var(--fc); border:1px solid var(--cborder); border-radius:50px; padding:10px 20px; font:inherit; outline:none; }
  input[type=text]:focus { border-color:var(--theme); }
  button { background:var(--theme); color:#fff; border:none; border-radius:50px; padding:10px 26px; cursor:pointer; font:inherit; }
  button:hover { background:var(--hover); }
  .card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:6px 20px; }
  .story { padding:13px 4px; border-bottom:1px dashed var(--cborder); }
  .story:last-child { border-bottom:none; }
  .story-head a.title { font-weight:700; color:var(--fc); }
  .story-head a.title:hover { color:var(--hover); }
  .topic { display:inline-block; background:var(--theme-op); color:#a8766f; border-radius:6px; padding:0 8px; font-size:.78rem; margin-right:8px; }
  .summary { color:var(--fc); opacity:.85; margin-top:5px; font-size:.95rem; }
  .meta { color:var(--gray); font-size:.8rem; margin-top:5px; }
  .empty { color:var(--gray); text-align:center; padding:28px 0; }
</style>
</head>
<body>
<div class="topnav">
  <a class="brand" href="/"><span class="dot"></span>GithubHot</a>
  <a class="site-page" href="/">← 返回双榜</a>
</div>
<div class="wrap">
  <h2>搜索：{{QUERY}}</h2>
  <div class="sub">检索已精选写作的资讯与事件 · 耗时 {{TOOK}}</div>
  <form method="get" action="/search">
    <input type="text" name="q" value="{{QUERY}}" placeholder="搜索标题 / 摘要，如：Claude、agent、向量数据库">
    <button>搜索</button>
  </form>
  <div class="card">{{RESULTS}}</div>
</div>
</body>
</html>
