    // 参考站本地缓存层（tw_cn 等脚本依赖）
    (function (win) {
      win.saveToLocal = {
        set: function (key, value, ttl) {
          var item = { value: value, expiry: Date.now() + (ttl || 0) * 86400000 };
          try { localStorage.setItem(key, JSON.stringify(item)); } catch (e) { /* 忽略 */ }
        },
        get: function (key) {
          try {
            var itemStr = localStorage.getItem(key);
            if (!itemStr) return undefined;
            var item = JSON.parse(itemStr);
            if (Date.now() > item.expiry) { localStorage.removeItem(key); return undefined; }
            return item.value;
          } catch (e) { return undefined; }
        }
      };
    })(window);
